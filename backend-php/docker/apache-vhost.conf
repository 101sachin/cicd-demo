# /            -> static frontend (HTML/CSS/JS)   from /var/www/frontend
# /api/*       -> PHP front controller            /var/www/app/public/index.php
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/frontend
    DirectoryIndex index.html

    <Directory /var/www/frontend>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    Alias /api /var/www/app/public
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # Any /api/... path that is not a real file is handled by index.php
        FallbackResource /api/index.php
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"
</VirtualHost>
