<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="container">
    <header>
        <h1>Student Registration</h1>
        <p class="subtitle">A CI/CD learning project &middot; <span id="api-status" class="badge">checking API…</span></p>
    </header>

    <section class="card">
        <form id="registration-form" novalidate>
            <div class="field">
                <label for="full_name">Full name *</label>
                <input id="full_name" name="full_name" type="text" autocomplete="name" required maxlength="100">
                <small class="error" data-error-for="full_name"></small>
            </div>

            <div class="field">
                <label for="email">Email *</label>
                <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
                <small class="error" data-error-for="email"></small>
            </div>

            <div class="field">
                <label for="phone">Phone</label>
                <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="20" placeholder="+91 98765 43210">
                <small class="error" data-error-for="phone"></small>
            </div>

            <div class="field">
                <label for="course">Course *</label>
                <select id="course" name="course" required>
                    <option value="">Select a course</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>Business Administration</option>
                </select>
                <small class="error" data-error-for="course"></small>
            </div>

            <button type="submit" id="submit-btn">Register</button>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>
    </section>

    <section class="card">
        <h2>Recently registered</h2>
        <ul id="student-list" class="student-list">
            <li class="muted">Loading…</li>
        </ul>
    </section>
</main>
<script src="app.js"></script>
</body>
</html>
